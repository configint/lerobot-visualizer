version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - cd lerobot/html_dataset_visualizer
            - npm ci  # or npm install
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: lerobot/html_dataset_visualizer/out
        files:
          - '**/*'
      cache:
        paths:
          - lerobot/html_dataset_visualizer/node_modules/**/*